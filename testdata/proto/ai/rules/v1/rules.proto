edition = "2024";

// Preserve implicit presence except where explicitly enabled on a field.
option features.field_presence = IMPLICIT;
option features.default_symbol_visibility = EXPORT_ALL;
option features.(pb.go).api_level = API_OPEN;

package ai.rules.v1;

option go_package = "ai/rules/v1;rulesv1";

import "jev/v1/options.proto";
import "google/protobuf/go_features.proto";

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_FAST = 1;
  MODE_BALANCED = 2;
  MODE_ACCURATE = 3;
  MODE_DEBUG = 4;
}

message RuleTestRecord {
  // 1. Oneof mutual exclusion -> maps to Choice
  oneof delivery_method {
    string email = 1;
    string sms = 2;
    string push_notification = 3;
  }

  // 2. Explicit field presence -> must NOT be treated as a oneof Choice!
  string optional_note = 4 [features.field_presence = EXPLICIT];

  // 3. Enum restricted by choices -> Choice with only [MODE_FAST, MODE_BALANCED]
  Mode execution_mode = 5 [
    (jev.v1.field).choice = {
      choices: ["MODE_FAST", "MODE_BALANCED"]
    }
  ];

  // 4. Enum restricted by not_in -> Choice omitting MODE_DEBUG
  Mode filtered_mode = 6 [
    (jev.v1.field).choice = {
      not_in: ["MODE_DEBUG"]
    }
  ];

  // 5. Integer with small range (<= 10) -> exact sequence [1..5]
  int32 rating_small = 7 [
    (jev.v1.field).score = {
      levels: [
        { value: 1, description: "1" },
        { value: 2, description: "2" },
        { value: 3, description: "3" },
        { value: 4, description: "4" },
        { value: 5, description: "5" }
      ]
    }
  ];

  // 6. Integer with explicit scale -> [1, 2, 3]
  int32 rating_strict = 8 [
    (jev.v1.field).score = {
      levels: [
        { value: 1, description: "1" },
        { value: 2, description: "2" },
        { value: 3, description: "3" }
      ]
    }
  ];

  // 7. Integer with discrete allowed values -> ["10", "20", "50", "100"]
  int32 discrete_code = 9 [
    (jev.v1.field).score = {
      levels: [
        { value: 10, description: "10" },
        { value: 20, description: "20" },
        { value: 50, description: "50" },
        { value: 100, description: "100" }
      ]
    }
  ];

  // 8. Large integer range -> 5-tier interpolated rubric [0, 250, 500, 750, 1000]
  int64 large_scale = 10 [
    (jev.v1.field).score = {
      levels: [
        { value: 0, description: "0" },
        { value: 250, description: "250" },
        { value: 500, description: "500" },
        { value: 750, description: "750" },
        { value: 1000, description: "1000" }
      ]
    }
  ];

  // 9. Float continuous range -> 5-tier interpolated rubric [-40.0, -15.0, 10.0, 35.0, 60.0]
  float temperature = 11 [
    (jev.v1.field).score = {
      levels: [
        { value: -40.0, description: "-40.0" },
        { value: -15.0, description: "-15.0" },
        { value: 10.0, description: "10.0" },
        { value: 35.0, description: "35.0" },
        { value: 60.0, description: "60.0" }
      ]
    }
  ];

  // 10. Float discrete values -> ["0.2", "0.5", "0.8"]
  float discrete_ratio = 12 [
    (jev.v1.field).score = {
      levels: [
        { value: 0.2, description: "0.2" },
        { value: 0.5, description: "0.5" },
        { value: 0.8, description: "0.8" }
      ]
    }
  ];

  // 11. String with allowed set of values -> Choice
  string security_clearance = 13 [
    (jev.v1.field).choice = {
      choices: ["PUBLIC", "SECRET", "TOP_SECRET"]
    }
  ];

  // 12. String with custom Jev criteria options -> Choice
  string decision_flag = 14 [
    (jev.v1.field).choice = {
      criteria: {
        key: "APPROVE",
        value: "Request approved"
      },
      criteria: {
        key: "REJECT",
        value: "Request rejected"
      }
    }
  ];

  // 13. Float with custom Jev min/max options -> [10.0, 20.0, 30.0, 40.0, 50.0]
  float custom_bounded_score = 15 [
    (jev.v1.field).score = {
      levels: [
        { value: 10, description: "10.0" },
        { value: 20, description: "20.0" },
        { value: 30, description: "30.0" },
        { value: 40, description: "40.0" },
        { value: 50, description: "50.0" }
      ]
    }
  ];

  // 14. Explicitly skipped field -> MUST NOT appear in questions
  string secret_token = 16 [
    (jev.v1.field).skip = true
  ];

  // 15. Freeform text without rules -> omitted from Jev questions
  string freeform_description = 17;
}
