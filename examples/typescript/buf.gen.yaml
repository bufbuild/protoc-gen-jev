# Generate TypeScript and Jev clients for the example schema.
version: v2
clean: true
inputs:
  # Share the incident schema and local detailed-response types with Go.
  - directory: ../..
    paths:
      - ../../examples/go/proto/incident/v1/incident.proto
      - ../../proto/jev/v1/response.proto
plugins:
  - remote: buf.build/bufbuild/es:v2.15.0
    exclude_types: [jev.v1.field, jev.v1.service, jev.v1.method]
    out: gen
    opt:
      - target=ts
  - local: protoc-gen-jev
    out: gen
    opt:
      - targets=ts
      - paths=source_relative
